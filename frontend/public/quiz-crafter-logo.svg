<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Quiz Crafter</title>
  <desc id="desc">Quiz Crafter neon lightbulb logo with brush-style Quiz wordmark and bright gradient Crafter text.</desc>
  <defs>
    <linearGradient id="qcNeon" x1="120" y1="390" x2="1120" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17E4E0"/>
      <stop offset="0.48" stop-color="#3FB8FF"/>
      <stop offset="1" stop-color="#8A5CFF"/>
    </linearGradient>
    <filter id="qcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.08 0 0 0 0 0.74 0 0 0 0 1 0 0 0 .85 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="paint" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
  </defs>
  <rect width="1280" height="520" rx="28" fill="#02040A"/>

  <g filter="url(#qcGlow)" fill="none" stroke="url(#qcNeon)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M255 126c-67 0-121 53-121 119 0 43 22 81 56 102 16 10 27 30 27 48v24h76v-25c0-19 11-37 27-48 35-23 57-61 57-101 0-66-55-119-122-119z" stroke-width="14"/>
    <path d="M216 444h78M224 474h63M206 418h98" stroke-width="12"/>
    <path d="M253 71v-28M155 100l-21-27M103 207H62M348 100l22-27M407 207h42" stroke-width="13"/>
    <path d="M230 354v-43c0-20-24-28-24-58 0-28 22-49 50-49 27 0 50 20 50 49 0 29-24 38-24 58v43" stroke="#fff" stroke-width="12"/>
  </g>

  <text x="255" y="302" text-anchor="middle" font-family="'Permanent Marker','Comic Sans MS','Segoe Print',cursive" font-size="118" font-weight="900" fill="#fff" filter="url(#paint)">?</text>

  <text x="470" y="246" font-family="'Permanent Marker','Comic Sans MS','Segoe Print',cursive" font-size="188" font-weight="900" fill="#fff" filter="url(#paint)">Quiz</text>
  <text x="469" y="365" font-family="'Oswald','Arial Narrow','Arial',sans-serif" font-size="104" font-weight="800" letter-spacing="26" fill="url(#qcNeon)">CRAFTER</text>

  <line x1="150" y1="430" x2="230" y2="430" stroke="#17E4E0" stroke-width="5" stroke-linecap="round"/>
  <text x="258" y="443" font-family="'Oswald','Arial Narrow','Arial',sans-serif" font-size="30" font-weight="700" letter-spacing="9" fill="#fff">CRAFT UNFORGETTABLE TRIVIA EXPERIENCES</text>
  <line x1="1045" y1="430" x2="1130" y2="430" stroke="#8A5CFF" stroke-width="5" stroke-linecap="round"/>

  <path d="M575 486c30-33 62-33 96 0 34-33 66-33 96 0" fill="none" stroke="url(#qcNeon)" stroke-width="8" stroke-linecap="round"/>
  <path d="M671 486l-17-3 11-13M767 486l17 3-11 13" fill="none" stroke="url(#qcNeon)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

name: Codex Player Feedback Patch
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: contains(github.event.issue.title, 'codex-run-player-feedback')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add player like dislike feedback
        run: |
          node <<'NODE'
          const fs = require('fs');
          const replaceRequired = (text, from, to, label) => {
            if (!text.includes(from)) throw new Error(`Missing ${label}`);
            return text.replace(from, to);
          };

          let player = fs.readFileSync('frontend/src/pages/PlayerSession.jsx', 'utf8');
          player = replaceRequired(player,
            '  const [hostUpdate, setHostUpdate] = useState(null);\n  const [submitted, setSubmitted] = useState(null);',
            '  const [hostUpdate, setHostUpdate] = useState(null);\n  const [feedbackByQuestion, setFeedbackByQuestion] = useState({});\n  const [submitted, setSubmitted] = useState(null);',
            'player feedback state');
          player = replaceRequired(player,
            '  const submitAnswer = (value) => {',
            '  const submitFeedback = (sentiment) => {\n    if (!player || !currentQuestion || !hostState) return;\n    const key = String(hostState.currentIndex);\n    setFeedbackByQuestion((current) => ({ ...current, [key]: sentiment }));\n    channelRef.current?.send({ type: "broadcast", event: "feedback_submit", payload: { playerId: player.id, playerName: player.name, sentiment, questionIndex: hostState.currentIndex, questionId: currentQuestion.id, questionText: currentQuestion.questionText, category: currentQuestion.category || "Uncategorized", roundName: currentQuestion.roundName || "Round", submittedAt: new Date().toISOString() } });\n    toast.success(sentiment === "like" ? "Marked as liked" : "Marked as disliked");\n  };\n\n  const submitAnswer = (value) => {',
            'submitFeedback function');
          player = replaceRequired(player,
            '</div><h2 className="text-2xl font-black leading-tight">{currentQuestion.questionText}</h2></div>{hostState.showAnswer ?',
            '</div><h2 className="text-2xl font-black leading-tight">{currentQuestion.questionText}</h2><FeedbackButtons selected={feedbackByQuestion[String(hostState.currentIndex)]} onSelect={submitFeedback} category={currentQuestion.category} /></div>{hostState.showAnswer ?',
            'feedback buttons render');
          player = replaceRequired(player,
            '\nconst LeaderboardView = ({ leaderboard, playerId }) =>',
            '\nconst FeedbackButtons = ({ selected, onSelect, category }) => (\n  <div className="mt-4 rounded-xl border border-white/10 bg-zinc-950/60 p-3 text-left">\n    <p className="text-xs text-zinc-500 mb-2">Help the host learn what players enjoy. This rates both the question and its category{category ? `: ${category}` : ""}.</p>\n    <div className="grid grid-cols-2 gap-2">\n      <Button type="button" onClick={() => onSelect("like")} className={selected === "like" ? "bg-emerald-500/25 text-emerald-200 border border-emerald-500/40 hover:bg-emerald-500/30" : "bg-zinc-900 text-zinc-200 border border-white/10 hover:bg-zinc-800"}>Like</Button>\n      <Button type="button" onClick={() => onSelect("dislike")} className={selected === "dislike" ? "bg-red-500/25 text-red-200 border border-red-500/40 hover:bg-red-500/30" : "bg-zinc-900 text-zinc-200 border border-white/10 hover:bg-zinc-800"}>Dislike</Button>\n    </div>\n  </div>\n);\n\nconst LeaderboardView = ({ leaderboard, playerId }) =>',
            'FeedbackButtons component');
          fs.writeFileSync('frontend/src/pages/PlayerSession.jsx', player);

          let host = fs.readFileSync('frontend/src/pages/HostSession.jsx', 'utf8');
          host = replaceRequired(host,
            '  const [hostUpdateMessage, setHostUpdateMessage] = useState("");\n  const [liveStatus, setLiveStatus] = useState("connecting");',
            '  const [hostUpdateMessage, setHostUpdateMessage] = useState("");\n  const [feedback, setFeedback] = useState([]);\n  const [liveStatus, setLiveStatus] = useState("connecting");',
            'host feedback state');
          host = replaceRequired(host,
            '      .on("broadcast", { event: "answer_submit" }, ({ payload }) => {\n        if (!payload?.playerId) return;\n        setAnswers((current) => {\n          const filtered = current.filter((answer) => !(answer.playerId === payload.playerId && answer.questionIndex === payload.questionIndex));\n          return [...filtered, payload];\n        });\n      })',
            '      .on("broadcast", { event: "answer_submit" }, ({ payload }) => {\n        if (!payload?.playerId) return;\n        setAnswers((current) => {\n          const filtered = current.filter((answer) => !(answer.playerId === payload.playerId && answer.questionIndex === payload.questionIndex));\n          return [...filtered, payload];\n        });\n      })\n      .on("broadcast", { event: "feedback_submit" }, ({ payload }) => {\n        if (!payload?.playerId || payload.questionIndex === undefined) return;\n        setFeedback((current) => {\n          const filtered = current.filter((item) => !(item.playerId === payload.playerId && item.questionIndex === payload.questionIndex));\n          return [...filtered, payload];\n        });\n      })',
            'feedback listener');
          host = replaceRequired(host,
            '<HostUpdatesPanel players={players} message={hostUpdateMessage} setMessage={setHostUpdateMessage} sendUpdate={sendHostUpdate} /><LeaderboardPanel',
            '<HostUpdatesPanel players={players} message={hostUpdateMessage} setMessage={setHostUpdateMessage} sendUpdate={sendHostUpdate} /><HostFeedbackPanel feedback={feedback} currentIndex={currentIndex} currentQuestion={currentQuestion} /><LeaderboardPanel',
            'feedback panel render');
          host = replaceRequired(host,
            '\nconst LeaderboardPanel = ({ leaderboard, teamName, teamScore, setTeamName, setTeamScore, addTeam, adjustScore, removeTeam, showLeaderboard }) =>',
            '\nconst HostFeedbackPanel = ({ feedback, currentIndex, currentQuestion }) => {\n  const current = feedback.filter((item) => Number(item.questionIndex) === Number(currentIndex));\n  const likes = current.filter((item) => item.sentiment === "like").length;\n  const dislikes = current.filter((item) => item.sentiment === "dislike").length;\n  const categoryRows = Object.values(feedback.reduce((groups, item) => {\n    const key = item.category || "Uncategorized";\n    if (!groups[key]) groups[key] = { category: key, likes: 0, dislikes: 0 };\n    if (item.sentiment === "like") groups[key].likes += 1;\n    if (item.sentiment === "dislike") groups[key].dislikes += 1;\n    return groups;\n  }, {})).sort((a, b) => (b.likes - b.dislikes) - (a.likes - a.dislikes)).slice(0, 5);\n\n  return <Card className="glass-card"><CardContent className="p-3"><div className="flex items-center justify-between gap-2 mb-3"><div className="flex items-center gap-2 text-white font-semibold"><Sparkles size={18} className="text-[#71E0DC]" />Player Feedback</div><Badge className="bg-zinc-800 text-zinc-300">{feedback.length} votes</Badge></div><div className="rounded-lg border border-white/10 bg-zinc-950/60 p-3 mb-3"><p className="text-xs text-zinc-500 mb-1">Current question</p><p className="text-sm text-zinc-300 line-clamp-2 mb-2">{currentQuestion?.questionText || "No question selected"}</p><div className="grid grid-cols-2 gap-2"><div className="rounded-md bg-emerald-500/10 border border-emerald-500/20 p-2 text-center"><p className="text-xl font-black text-emerald-300">{likes}</p><p className="text-xs text-zinc-500">Likes</p></div><div className="rounded-md bg-red-500/10 border border-red-500/20 p-2 text-center"><p className="text-xl font-black text-red-300">{dislikes}</p><p className="text-xs text-zinc-500">Dislikes</p></div></div></div><div className="space-y-2 max-h-40 overflow-y-auto pr-1">{categoryRows.map((row) => <div key={row.category} className="flex items-center justify-between gap-2 rounded-md border border-white/10 bg-zinc-950/60 px-2 py-2"><span className="text-sm text-zinc-300 truncate">{row.category}</span><span className="text-xs text-zinc-500">Like {row.likes} · Dislike {row.dislikes}</span></div>)}{!categoryRows.length && <p className="text-xs text-zinc-500 text-center py-2">Likes and dislikes will appear as players vote.</p>}</div></CardContent></Card>;\n};\n\nconst LeaderboardPanel = ({ leaderboard, teamName, teamScore, setTeamName, setTeamScore, addTeam, adjustScore, removeTeam, showLeaderboard }) =>',
            'HostFeedbackPanel component');
          fs.writeFileSync('frontend/src/pages/HostSession.jsx', host);
          NODE
      - name: Commit changes
        run: |
          git config user.name "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"
          git add frontend/src/pages/PlayerSession.jsx frontend/src/pages/HostSession.jsx
          git commit -m "Add player question and category feedback" || exit 0
          git push
      - name: Close trigger issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' });

name: Codex Fix Host Release Buttons

on:
  push:
    paths:
      - '.codex-trigger-fix-host-release-buttons'
      - '.github/scripts/fix_host_release_buttons.py'
      - '.github/workflows/codex-fix-host-release-buttons.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/fix_host_release_buttons.py
      - name: Commit changes
        run: |
          git config user.name "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"
          git add frontend/src/pages/HostSession.jsx
          git commit -m "Fix host presentation release buttons" || exit 0
          git push

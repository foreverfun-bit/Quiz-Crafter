name: Codex Hide Player Categories

on:
  push:
    paths:
      - '.codex-trigger-hide-player-categories'
      - '.github/scripts/hide_player_categories_until_round_info.py'
      - '.github/workflows/codex-hide-player-categories.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/hide_player_categories_until_round_info.py
      - name: Commit changes
        run: |
          git config user.name "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"
          git add frontend/src/pages/PlayerSession.jsx
          git commit -m "Hide player categories until round info" || exit 0
          git push

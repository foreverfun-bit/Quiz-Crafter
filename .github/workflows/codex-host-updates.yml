name: Codex Add Host Updates
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch host update opt-in
        run: |
          node <<'NODE'
          const fs = require('fs');
          const replaceRequired = (text, from, to, label) => {
            if (!text.includes(from)) throw new Error(`Missing ${label}`);
            return text.replace(from, to);
          };

          let player = fs.readFileSync('frontend/src/pages/PlayerSession.jsx', 'utf8');
          player = replaceRequired(player,
            '  const [answer, setAnswer] = useState("");\n  const [wagerAmount, setWagerAmount] = useState("");\n  const [submitted, setSubmitted] = useState(null);',
            '  const [answer, setAnswer] = useState("");\n  const [wagerAmount, setWagerAmount] = useState("");\n  const [updatePreference, setUpdatePreference] = useState("none");\n  const [updateContact, setUpdateContact] = useState("");\n  const [hostUpdate, setHostUpdate] = useState(null);\n  const [submitted, setSubmitted] = useState(null);',
            'player state');

          player = replaceRequired(player,
            '      .on("broadcast", { event: "host_state" }, ({ payload }) => {\n        setHostState(payload || null);\n        setSubmitted((previous) => {\n          if (!previous) return null;\n          return previous.questionIndex === payload?.currentIndex ? previous : null;\n        });\n      })',
            '      .on("broadcast", { event: "host_state" }, ({ payload }) => {\n        setHostState(payload || null);\n        setSubmitted((previous) => {\n          if (!previous) return null;\n          return previous.questionIndex === payload?.currentIndex ? previous : null;\n        });\n      })\n      .on("broadcast", { event: "host_update" }, ({ payload }) => {\n        if (!payload?.message) return;\n        setHostUpdate(payload);\n        toast.info("Host update received");\n      })',
            'host update listener');

          player = replaceRequired(player,
            '          channel.send({ type: "broadcast", event: "player_join", payload: { playerId: player.id, playerName: player.name, joinedAt: new Date().toISOString() } });',
            '          channel.send({ type: "broadcast", event: "player_join", payload: { playerId: player.id, playerName: player.name, updatePreference: player.updatePreference || "none", updateContact: player.updateContact || "", joinedAt: new Date().toISOString() } });',
            'player join payload');

          player = replaceRequired(player,
            '  const joinGame = () => {\n    const trimmed = name.trim();\n    if (!trimmed) return toast.error("Enter a team name");\n    const nextPlayer = { id: makePlayerId(), name: trimmed.slice(0, 32) };\n    sessionStorage.setItem(`quiz-crafter-player-${id}`, JSON.stringify(nextPlayer));\n    setPlayer(nextPlayer);\n  };',
            '  const joinGame = () => {\n    const trimmed = name.trim();\n    const contact = updateContact.trim();\n    if (!trimmed) return toast.error("Enter a team name");\n    if (updatePreference === "email" && !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(contact)) return toast.error("Enter a valid email address");\n    if (updatePreference === "text" && contact.replace(/\\D/g, "").length < 10) return toast.error("Enter a valid phone number");\n    const nextPlayer = { id: makePlayerId(), name: trimmed.slice(0, 32), updatePreference, updateContact: updatePreference === "none" ? "" : contact };\n    sessionStorage.setItem(`quiz-crafter-player-${id}`, JSON.stringify(nextPlayer));\n    setPlayer(nextPlayer);\n  };',
            'joinGame');

          player = replaceRequired(player,
            '        {gameStarted && hostState?.mode === "leaderboard" && <LeaderboardView leaderboard={leaderboard} playerId={player.id} />}',
            '        {hostUpdate && <HostUpdateBanner update={hostUpdate} onDismiss={() => setHostUpdate(null)} />}\n        {gameStarted && hostState?.mode === "leaderboard" && <LeaderboardView leaderboard={leaderboard} playerId={player.id} />}',
            'host update banner render');

          player = replaceRequired(player,
            '    return <JoinScreen name={name} setName={setName} joinGame={joinGame} sessionName={sessionName} roundCategories={roundCategories} branding={branding} />;',
            '    return <JoinScreen name={name} setName={setName} joinGame={joinGame} sessionName={sessionName} roundCategories={roundCategories} branding={branding} updatePreference={updatePreference} setUpdatePreference={setUpdatePreference} updateContact={updateContact} setUpdateContact={setUpdateContact} />;',
            'join screen props');

          player = replaceRequired(player,
            'const JoinScreen = ({ name, setName, joinGame, sessionName, roundCategories, branding }) => (',
            'const JoinScreen = ({ name, setName, joinGame, sessionName, roundCategories, branding, updatePreference, setUpdatePreference, updateContact, setUpdateContact }) => (',
            'JoinScreen signature');

          player = replaceRequired(player,
            '<Card className="glass-card mt-4"><CardContent className="p-5 space-y-4"><div><label className="text-zinc-400 text-sm block mb-1.5">Team Name</label><input value={name} onChange={(event) => setName(event.target.value)} onKeyDown={(event) => event.key === "Enter" && joinGame()} placeholder="Enter team name" maxLength={32} className="w-full h-12 rounded-lg bg-zinc-950 border border-white/10 px-3 text-white text-lg outline-none focus:border-[#71E0DC]/60" autoFocus /></div><Button onClick={joinGame} className="w-full h-12 gradient-btn text-base font-bold">Join Game</Button></CardContent></Card>',
            '<Card className="glass-card mt-4"><CardContent className="p-5 space-y-4"><div><label className="text-zinc-400 text-sm block mb-1.5">Team Name</label><input value={name} onChange={(event) => setName(event.target.value)} onKeyDown={(event) => event.key === "Enter" && joinGame()} placeholder="Enter team name" maxLength={32} className="w-full h-12 rounded-lg bg-zinc-950 border border-white/10 px-3 text-white text-lg outline-none focus:border-[#71E0DC]/60" autoFocus /></div><div className="rounded-lg border border-white/10 bg-zinc-950/60 p-3 space-y-3"><div><p className="text-sm font-bold text-white">Would you like updates from the host?</p><p className="text-xs text-zinc-500">Clues, cancellations, schedule changes, and other trivia night updates.</p></div><div className="grid grid-cols-3 gap-2"><button type="button" onClick={() => setUpdatePreference("none")} className={`h-10 rounded-md border text-sm font-bold ${updatePreference === "none" ? "border-[#71E0DC]/60 bg-[#71E0DC]/15 text-[#71E0DC]" : "border-white/10 bg-zinc-900 text-zinc-300"}`}>No</button><button type="button" onClick={() => setUpdatePreference("email")} className={`h-10 rounded-md border text-sm font-bold ${updatePreference === "email" ? "border-[#71E0DC]/60 bg-[#71E0DC]/15 text-[#71E0DC]" : "border-white/10 bg-zinc-900 text-zinc-300"}`}>Email</button><button type="button" onClick={() => setUpdatePreference("text")} className={`h-10 rounded-md border text-sm font-bold ${updatePreference === "text" ? "border-[#71E0DC]/60 bg-[#71E0DC]/15 text-[#71E0DC]" : "border-white/10 bg-zinc-900 text-zinc-300"}`}>Text</button></div>{updatePreference !== "none" && <input value={updateContact} onChange={(event) => setUpdateContact(event.target.value)} onKeyDown={(event) => event.key === "Enter" && joinGame()} placeholder={updatePreference === "email" ? "Email address" : "Phone number"} inputMode={updatePreference === "email" ? "email" : "tel"} className="w-full h-11 rounded-lg bg-zinc-950 border border-white/10 px-3 text-white outline-none focus:border-[#71E0DC]/60" />}</div><Button onClick={joinGame} className="w-full h-12 gradient-btn text-base font-bold">Join Game</Button></CardContent></Card>',
            'JoinScreen card');

          const banner = '\nconst HostUpdateBanner = ({ update, onDismiss }) => (\n  <div className="fixed inset-x-4 top-20 z-30 mx-auto max-w-md rounded-xl border border-[#71E0DC]/30 bg-zinc-950/95 p-4 shadow-2xl shadow-black/50">\n    <div className="flex items-start justify-between gap-3">\n      <div>\n        <p className="text-xs font-bold uppercase tracking-wide text-[#71E0DC]">Host Update</p>\n        <p className="mt-1 text-sm text-white whitespace-pre-wrap">{update.message}</p>\n      </div>\n      <button type="button" onClick={onDismiss} className="rounded-md border border-white/10 px-2 py-1 text-xs text-zinc-300 hover:text-white">Close</button>\n    </div>\n  </div>\n);\n';
          player = replaceRequired(player,
            '\nconst PlayerLobby = ({ sessionName, connected, roundCategories, branding }) => (',
            banner + '\nconst PlayerLobby = ({ sessionName, connected, roundCategories, branding }) => (',
            'HostUpdateBanner insert');

          fs.writeFileSync('frontend/src/pages/PlayerSession.jsx', player);

          let host = fs.readFileSync('frontend/src/pages/HostSession.jsx', 'utf8');
          host = replaceRequired(host,
            '  Link,\n  List,\n  Loader2,',
            '  Link,\n  List,\n  Mail,\n  Loader2,',
            'Mail import');
          host = replaceRequired(host,
            '  Play,\n  Plus,\n  RotateCcw,',
            '  Play,\n  Plus,\n  Phone,\n  RotateCcw,',
            'Phone import');
          host = replaceRequired(host,
            '  const [answers, setAnswers] = useState([]);\n  const [liveStatus, setLiveStatus] = useState("connecting");',
            '  const [answers, setAnswers] = useState([]);\n  const [hostUpdateMessage, setHostUpdateMessage] = useState("");\n  const [liveStatus, setLiveStatus] = useState("connecting");',
            'host state');
          host = replaceRequired(host,
            '        setPlayers((current) => current.some((player) => player.id === payload.playerId) ? current : [...current, { id: payload.playerId, name: payload.playerName || "Team", joinedAt: payload.joinedAt }]);',
            '        setPlayers((current) => {\n          const nextPlayer = { id: payload.playerId, name: payload.playerName || "Team", updatePreference: payload.updatePreference || "none", updateContact: payload.updateContact || "", joinedAt: payload.joinedAt };\n          return current.some((player) => player.id === payload.playerId) ? current.map((player) => player.id === payload.playerId ? { ...player, ...nextPlayer } : player) : [...current, nextPlayer];\n        });',
            'player join handling');

          host = replaceRequired(host,
            '  const addTeam = () => {\n    const name = teamName.trim();',
            '  const sendHostUpdate = async () => {\n    const message = hostUpdateMessage.trim();\n    if (!message) return toast.error("Write an update first");\n    liveChannelRef.current?.send({ type: "broadcast", event: "host_update", payload: { message, sentAt: new Date().toISOString() } });\n    setHostUpdateMessage("");\n    toast.success("Update sent to connected players");\n  };\n\n  const addTeam = () => {\n    const name = teamName.trim();',
            'sendHostUpdate');

          host = replaceRequired(host,
            '<PhonePlayPanel joinUrl={joinUrl} copyJoinLink={copyJoinLink} players={players} answers={currentAnswers} adjustScore={adjustScore} pointsPerQuestion={Number(pointsPerQuestion) || getDefaultPoints(currentQuestion)} wagerMode={wagerMode} setMode={setPresentMode} /><LeaderboardPanel',
            '<PhonePlayPanel joinUrl={joinUrl} copyJoinLink={copyJoinLink} players={players} answers={currentAnswers} adjustScore={adjustScore} pointsPerQuestion={Number(pointsPerQuestion) || getDefaultPoints(currentQuestion)} wagerMode={wagerMode} setMode={setPresentMode} /><HostUpdatesPanel players={players} message={hostUpdateMessage} setMessage={setHostUpdateMessage} sendUpdate={sendHostUpdate} /><LeaderboardPanel',
            'aside panel');

          const panel = '\nconst HostUpdatesPanel = ({ players, message, setMessage, sendUpdate }) => {\n  const emailPlayers = players.filter((player) => player.updatePreference === "email" && player.updateContact);\n  const textPlayers = players.filter((player) => player.updatePreference === "text" && player.updateContact);\n  const copyContacts = async (items, label) => {\n    if (!items.length) return toast.error(`No ${label} contacts yet`);\n    try {\n      await navigator.clipboard.writeText(items.map((player) => `${player.name}: ${player.updateContact}`).join("\\n"));\n      toast.success(`${label} contacts copied`);\n    } catch {\n      toast.error("Could not copy contacts");\n    }\n  };\n\n  return <Card className="glass-card"><CardContent className="p-3"><div className="flex items-center justify-between gap-2 mb-3"><div className="flex items-center gap-2 text-white font-semibold"><MessageSquare size={18} className="text-[#AEB2EF]" />Host Updates</div><Badge className="bg-zinc-800 text-zinc-300">{emailPlayers.length + textPlayers.length} opted in</Badge></div><textarea value={message} onChange={(event) => setMessage(event.target.value)} placeholder="Type a clue, cancellation, or update for players..." className="min-h-24 w-full resize-none rounded-lg border border-white/10 bg-zinc-950 px-3 py-2 text-sm text-white outline-none focus:border-[#71E0DC]/60" /><Button onClick={sendUpdate} disabled={!message.trim()} className="mt-2 w-full gradient-btn"><SendIconLabel />Send In-App Update</Button><div className="mt-3 grid grid-cols-2 gap-2"><Button size="sm" variant="outline" onClick={() => copyContacts(emailPlayers, "email")} className="border-white/10 text-zinc-300 hover:text-white"><Mail size={14} className="mr-1" />Emails ({emailPlayers.length})</Button><Button size="sm" variant="outline" onClick={() => copyContacts(textPlayers, "text")} className="border-white/10 text-zinc-300 hover:text-white"><Phone size={14} className="mr-1" />Texts ({textPlayers.length})</Button></div><p className="mt-2 text-[11px] text-zinc-500">In-app updates go to connected phones now. Email/text contacts are collected here for host follow-up.</p></CardContent></Card>;\n};\n\nconst SendIconLabel = () => <><MessageSquare size={15} className="mr-2" /></>;\n';
          host = replaceRequired(host,
            '\nconst LeaderboardPanel = ({ leaderboard, teamName, teamScore, setTeamName, setTeamScore, addTeam, adjustScore, removeTeam, showLeaderboard }) =>',
            panel + '\nconst LeaderboardPanel = ({ leaderboard, teamName, teamScore, setTeamName, setTeamScore, addTeam, adjustScore, removeTeam, showLeaderboard }) =>',
            'HostUpdatesPanel insert');

          fs.writeFileSync('frontend/src/pages/HostSession.jsx', host);
          NODE
      - name: Commit changes
        run: |
          git config user.name "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"
          git add frontend/src/pages/PlayerSession.jsx frontend/src/pages/HostSession.jsx
          git commit -m "Add player host update opt-in"
          git push

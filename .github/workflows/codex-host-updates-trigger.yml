name: Codex Trigger Host Updates Patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-host-updates-trigger.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run patch from saved workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/codex-host-updates.yml').read_text()
          start = text.index("          const fs = require('fs');")
          end = text.index("          NODE", start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end].splitlines())
          Path('/tmp/codex-host-updates.js').write_text(script)
          PY
          node /tmp/codex-host-updates.js
      - name: Commit changes
        run: |
          git config user.name "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"
          git add frontend/src/pages/PlayerSession.jsx frontend/src/pages/HostSession.jsx
          git commit -m "Add player host update opt-in" || exit 0
          git push

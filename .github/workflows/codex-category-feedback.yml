name: Codex Category Feedback Patch
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: contains(github.event.issue.title, 'codex-run-category-feedback')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add separate category feedback
        run: |
          node <<'NODE'
          const fs = require('fs');
          const replaceRequired = (text, from, to, label) => {
            if (!text.includes(from)) throw new Error(`Missing ${label}`);
            return text.replace(from, to);
          };

          let player = fs.readFileSync('frontend/src/pages/PlayerSession.jsx', 'utf8');
          player = replaceRequired(player,
            '  const [feedbackByQuestion, setFeedbackByQuestion] = useState({});\n  const [submitted, setSubmitted] = useState(null);',
            '  const [feedbackByQuestion, setFeedbackByQuestion] = useState({});\n  const [feedbackByCategory, setFeedbackByCategory] = useState({});\n  const [submitted, setSubmitted] = useState(null);',
            'player category feedback state');
          player = replaceRequired(player,
            '  const gameStarted = hasGameStarted(hostState);',
            '  const gameStarted = hasGameStarted(hostState);\n  const activeRoundCategories = useMemo(() => {\n    const roundName = currentQuestion?.roundName;\n    if (!roundName) return [];\n    const matchedRound = roundCategories.find((round) => round.name === roundName);\n    return matchedRound?.categories || [];\n  }, [currentQuestion?.roundName, roundCategories]);',
            'active round categories');
          player = replaceRequired(player,
            '  const submitFeedback = (sentiment) => {\n    if (!player || !currentQuestion || !hostState) return;\n    const key = String(hostState.currentIndex);\n    setFeedbackByQuestion((current) => ({ ...current, [key]: sentiment }));\n    channelRef.current?.send({ type: "broadcast", event: "feedback_submit", payload: { playerId: player.id, playerName: player.name, sentiment, questionIndex: hostState.currentIndex, questionId: currentQuestion.id, questionText: currentQuestion.questionText, category: currentQuestion.category || "Uncategorized", roundName: currentQuestion.roundName || "Round", submittedAt: new Date().toISOString() } });\n    toast.success(sentiment === "like" ? "Marked as liked" : "Marked as disliked");\n  };',
            '  const submitFeedback = (sentiment) => {\n    if (!player || !currentQuestion || !hostState) return;\n    const key = String(hostState.currentIndex);\n    setFeedbackByQuestion((current) => ({ ...current, [key]: sentiment }));\n    channelRef.current?.send({ type: "broadcast", event: "feedback_submit", payload: { playerId: player.id, playerName: player.name, sentiment, questionIndex: hostState.currentIndex, questionId: currentQuestion.id, questionText: currentQuestion.questionText, category: currentQuestion.category || "Uncategorized", roundName: currentQuestion.roundName || "Round", submittedAt: new Date().toISOString() } });\n    toast.success(sentiment === "like" ? "Question liked" : "Question disliked");\n  };\n\n  const submitCategoryFeedback = (category, sentiment) => {\n    if (!player || !hostState || !category) return;\n    const key = `${hostState.currentIndex}-${category}`;\n    setFeedbackByCategory((current) => ({ ...current, [key]: sentiment }));\n    channelRef.current?.send({ type: "broadcast", event: "category_feedback_submit", payload: { playerId: player.id, playerName: player.name, sentiment, category, questionIndex: hostState.currentIndex, roundName: currentQuestion?.roundName || "Round", submittedAt: new Date().toISOString() } });\n    toast.success(sentiment === "like" ? "Category liked" : "Category disliked");\n  };',
            'submit category feedback');
          player = replaceRequired(player,
            '        {gameStarted && hostState?.mode === "leaderboard" && <LeaderboardView leaderboard={leaderboard} playerId={player.id} />}\n        {gameStarted && hostState && hostState.mode !== "leaderboard" && !currentQuestion && <div className="text-center"><p className="text-zinc-400">Waiting for the next question.</p></div>}\n        {gameStarted && hostState && hostState.mode !== "leaderboard" && currentQuestion && <div className="w-full max-w-md"><div className="text-center mb-5">',
            '        {gameStarted && hostState?.mode === "leaderboard" && <LeaderboardView leaderboard={leaderboard} playerId={player.id} />}\n        {gameStarted && hostState?.mode === "categories" && <RoundIntroFeedback roundName={currentQuestion?.roundName || "Round"} categories={activeRoundCategories} selectedByCategory={feedbackByCategory} currentIndex={hostState.currentIndex} onSelect={submitCategoryFeedback} />}\n        {gameStarted && hostState && hostState.mode !== "leaderboard" && hostState.mode !== "categories" && !currentQuestion && <div className="text-center"><p className="text-zinc-400">Waiting for the next question.</p></div>}\n        {gameStarted && hostState && hostState.mode !== "leaderboard" && hostState.mode !== "categories" && currentQuestion && <div className="w-full max-w-md"><div className="text-center mb-5">',
            'round intro render');
          player = replaceRequired(player,
            '<FeedbackButtons selected={feedbackByQuestion[String(hostState.currentIndex)]} onSelect={submitFeedback} category={currentQuestion.category} />',
            '<FeedbackButtons selected={feedbackByQuestion[String(hostState.currentIndex)]} onSelect={submitFeedback} />',
            'question feedback props');
          player = replaceRequired(player,
            'const FeedbackButtons = ({ selected, onSelect, category }) => (\n  <div className="mt-4 rounded-xl border border-white/10 bg-zinc-950/60 p-3 text-left">\n    <p className="text-xs text-zinc-500 mb-2">Help the host learn what players enjoy. This rates both the question and its category{category ? `: ${category}` : ""}.</p>',
            'const FeedbackButtons = ({ selected, onSelect }) => (\n  <div className="mt-4 rounded-xl border border-white/10 bg-zinc-950/60 p-3 text-left">\n    <p className="text-xs text-zinc-500 mb-2">Rate this question for the host.</p>',
            'question feedback copy');
          player = replaceRequired(player,
            '\nconst FeedbackButtons = ({ selected, onSelect }) => (',
            '\nconst RoundIntroFeedback = ({ roundName, categories, selectedByCategory, currentIndex, onSelect }) => (\n  <div className="w-full max-w-md text-center">\n    <Tags className="mx-auto text-[#71E0DC] mb-3" size={38} />\n    <p className="text-[#71E0DC] text-sm font-bold uppercase tracking-wide mb-2">Round Info</p>\n    <h2 className="text-3xl font-black mb-2">{roundName}</h2>\n    <p className="text-zinc-500 mb-5">Rate the categories separately from the questions.</p>\n    <div className="space-y-3 text-left">\n      {categories.map((category) => {\n        const selected = selectedByCategory[`${currentIndex}-${category}`];\n        return <div key={category} className="rounded-xl border border-white/10 bg-zinc-950/70 p-3"><p className="font-bold text-white mb-2">{category}</p><div className="grid grid-cols-2 gap-2"><Button type="button" onClick={() => onSelect(category, "like")} className={selected === "like" ? "bg-emerald-500/25 text-emerald-200 border border-emerald-500/40 hover:bg-emerald-500/30" : "bg-zinc-900 text-zinc-200 border border-white/10 hover:bg-zinc-800"}>Like Category</Button><Button type="button" onClick={() => onSelect(category, "dislike")} className={selected === "dislike" ? "bg-red-500/25 text-red-200 border border-red-500/40 hover:bg-red-500/30" : "bg-zinc-900 text-zinc-200 border border-white/10 hover:bg-zinc-800"}>Dislike Category</Button></div></div>;\n      })}\n      {!categories.length && <p className="text-sm text-zinc-500 text-center rounded-xl border border-white/10 bg-zinc-950/70 p-4">Categories will appear when this round has categories saved.</p>}\n    </div>\n  </div>\n);\n\nconst FeedbackButtons = ({ selected, onSelect }) => (',
            'RoundIntroFeedback insert');
          fs.writeFileSync('frontend/src/pages/PlayerSession.jsx', player);

          let host = fs.readFileSync('frontend/src/pages/HostSession.jsx', 'utf8');
          host = replaceRequired(host,
            '  const [feedback, setFeedback] = useState([]);\n  const [liveStatus, setLiveStatus] = useState("connecting");',
            '  const [feedback, setFeedback] = useState([]);\n  const [categoryFeedback, setCategoryFeedback] = useState([]);\n  const [liveStatus, setLiveStatus] = useState("connecting");',
            'host category feedback state');
          host = replaceRequired(host,
            '      .on("broadcast", { event: "feedback_submit" }, ({ payload }) => {\n        if (!payload?.playerId || payload.questionIndex === undefined) return;\n        setFeedback((current) => {\n          const filtered = current.filter((item) => !(item.playerId === payload.playerId && item.questionIndex === payload.questionIndex));\n          return [...filtered, payload];\n        });\n      })',
            '      .on("broadcast", { event: "feedback_submit" }, ({ payload }) => {\n        if (!payload?.playerId || payload.questionIndex === undefined) return;\n        setFeedback((current) => {\n          const filtered = current.filter((item) => !(item.playerId === payload.playerId && item.questionIndex === payload.questionIndex));\n          return [...filtered, payload];\n        });\n      })\n      .on("broadcast", { event: "category_feedback_submit" }, ({ payload }) => {\n        if (!payload?.playerId || !payload.category) return;\n        setCategoryFeedback((current) => {\n          const filtered = current.filter((item) => !(item.playerId === payload.playerId && item.category === payload.category && item.roundName === payload.roundName));\n          return [...filtered, payload];\n        });\n      })',
            'category feedback listener');
          host = replaceRequired(host,
            '<HostFeedbackPanel feedback={feedback} currentIndex={currentIndex} currentQuestion={currentQuestion} />',
            '<HostFeedbackPanel feedback={feedback} categoryFeedback={categoryFeedback} currentIndex={currentIndex} currentQuestion={currentQuestion} />',
            'feedback panel props');
          host = replaceRequired(host,
            'const HostFeedbackPanel = ({ feedback, currentIndex, currentQuestion }) => {',
            'const HostFeedbackPanel = ({ feedback, categoryFeedback, currentIndex, currentQuestion }) => {',
            'HostFeedbackPanel signature');
          host = replaceRequired(host,
            '  const categoryRows = Object.values(feedback.reduce((groups, item) => {',
            '  const categoryRows = Object.values(categoryFeedback.reduce((groups, item) => {',
            'category feedback source');
          host = replaceRequired(host,
            '<Badge className="bg-zinc-800 text-zinc-300">{feedback.length} votes</Badge>',
            '<Badge className="bg-zinc-800 text-zinc-300">{feedback.length + categoryFeedback.length} votes</Badge>',
            'vote count');
          host = replaceRequired(host,
            'Likes and dislikes will appear as players vote.',
            'Category likes and dislikes will appear from the round intro screen.',
            'empty feedback copy');
          fs.writeFileSync('frontend/src/pages/HostSession.jsx', host);
          NODE
      - name: Commit changes
        run: |
          git config user.name "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"
          git add frontend/src/pages/PlayerSession.jsx frontend/src/pages/HostSession.jsx
          git commit -m "Separate category feedback from question feedback" || exit 0
          git push
      - name: Close trigger issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' });

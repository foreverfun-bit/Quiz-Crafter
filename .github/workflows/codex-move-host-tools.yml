name: Codex Move Host Tools

on:
  push:
    paths:
      - '.codex-trigger-move-host-tools'
      - '.github/scripts/move_host_tools.py'
      - '.github/workflows/codex-move-host-tools.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/move_host_tools.py
      - name: Commit changes
        run: |
          git config user.name "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"
          git add frontend/src/App.js frontend/src/components/Sidebar.jsx frontend/src/pages/HostSession.jsx
          git commit -m "Move updates and feedback to host tools" || exit 0
          git push

name: Patch Round Intro Metadata

on:
  push:
    paths:
      - .github/workflows/patch-round-intro.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move round descriptions to round intro metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const patchFile = (path, replacements) => {
            let content = fs.readFileSync(path, 'utf8');
            const before = content;
            for (const [from, to, label] of replacements) {
              if (!content.includes(from)) {
                console.error(`Missing ${label} in ${path}`);
                process.exit(1);
              }
              content = content.replace(from, to);
            }
            if (content !== before) fs.writeFileSync(path, content);
          };

          patchFile('frontend/src/pages/BuildSession.jsx', [
            [
              'const toSessionQuestion = (question, round, roundIndex, sourceOrder) => ({ category: question.category || "General", round_name: round.name, round_description: round.description || null, round_order: roundIndex + 1, source_order: sourceOrder + 1, question_text: question.question_text, correct_answer: question.correct_answer, question_type: normalizeType(question), incorrect_answers: Array.isArray(question.options) && question.options.length ? question.options.join("; ") : question.incorrect_answers || null, fun_fact: question.fun_fact || null, image_url: question.image_url || null, image_timing: normalizeImageTiming(question.image_timing) });',
              'const toSessionQuestion = (question, round, roundIndex, sourceOrder) => ({ category: question.category || "General", round_name: round.name, round_order: roundIndex + 1, source_order: sourceOrder + 1, question_text: question.question_text, correct_answer: question.correct_answer, question_type: normalizeType(question), incorrect_answers: Array.isArray(question.options) && question.options.length ? question.options.join("; ") : question.incorrect_answers || null, fun_fact: question.fun_fact || null, image_url: question.image_url || null, image_timing: normalizeImageTiming(question.image_timing) });',
              'remove per-question round description'
            ],
            [
              'const handleSave = async (goLive = false) => { if (!user?.id) return toast.error("You must be signed in"); const builtName = sessionName.trim() || `${new Date().toLocaleDateString()} Trivia`; const grouped = { true_false_questions: [], multiple_choice_questions: [], written_questions: [], picture_questions: [] }; const selectedLibraryIds = new Set();',
              'const handleSave = async (goLive = false) => { if (!user?.id) return toast.error("You must be signed in"); const builtName = sessionName.trim() || `${new Date().toLocaleDateString()} Trivia`; const grouped = { true_false_questions: [], multiple_choice_questions: [], written_questions: [], picture_questions: [] }; const selectedLibraryIds = new Set(); const roundDescriptions = rounds.map((round, index) => ({ name: round.name, description: round.description || "", order: index + 1, categories: [...new Set((round.questionIds || []).map((id) => questionById.get(String(id))?.category).filter(Boolean))] }));',
              'round metadata in save'
            ],
            [
              'const { data, error } = await supabase.from("sessions").insert({ user_id: user.id, name: builtName, session_name: builtName, is_past: false, ...grouped }).select("id").single(); if (error) throw error;',
              'const baseSessionPayload = { user_id: user.id, name: builtName, session_name: builtName, is_past: false, ...grouped }; const { data, error } = await supabase.from("sessions").insert({ ...baseSessionPayload, round_descriptions: roundDescriptions }).select("id").single(); if (error) { const retry = await supabase.from("sessions").insert(baseSessionPayload).select("id").single(); if (retry.error) throw retry.error; data = retry.data; }',
              'save round metadata with fallback'
            ]
          ]);

          patchFile('frontend/src/pages/PresentSession.jsx', [
            [
              'const getRoundName = (question, fallbackOrder = 1) => {\n  if (question?.round_name) return question.round_name;\n  if (question?.round_title) return question.round_title;\n  if (question?.round && Number.isNaN(Number(question.round))) return question.round;\n  return `Round ${getRoundOrder(question, fallbackOrder)}`;\n};',
              'const getRoundName = (question, fallbackOrder = 1) => {\n  if (question?.round_name) return question.round_name;\n  if (question?.round_title) return question.round_title;\n  if (question?.round && Number.isNaN(Number(question.round))) return question.round;\n  return `Round ${getRoundOrder(question, fallbackOrder)}`;\n};\n\nconst getRoundMetadata = (session) => {\n  const raw = session?.round_descriptions || session?.rounds_metadata || session?.rounds || [];\n  return Array.isArray(raw) ? raw : [];\n};\n\nconst getRoundDescription = (session, roundOrder, roundName) => {\n  const metadata = getRoundMetadata(session);\n  const match = metadata.find((round) => Number(round.order || round.round_order) === Number(roundOrder) || String(round.name || round.round_name || "").toLowerCase() === String(roundName || "").toLowerCase());\n  return match?.description || match?.round_description || "";\n};',
              'present metadata helpers'
            ],
            [
              '        sourceOrder: getSourceOrder(question, index + 1),\n      };',
              '        sourceOrder: getSourceOrder(question, index + 1),\n        roundDescription: question.round_description || getRoundDescription(session, roundOrder, getRoundName(question, roundOrder)),\n      };',
              'present round description on flattened question'
            ],
            [
              'if (!groups.has(key)) groups.set(key, { key, name: question.roundName, order: question.roundOrder, startIndex: index, questions: [] });',
              'if (!groups.has(key)) groups.set(key, { key, name: question.roundName, description: question.roundDescription || "", order: question.roundOrder, startIndex: index, questions: [] });',
              'present round description group'
            ],
            [
              '<h1 className="text-3xl lg:text-5xl font-black mt-1">{mode === "categories" ? "Round Categories" : mode === "leaderboard" ? "Leaderboard" : currentRound?.name || "Question"}</h1>',
              '<h1 className="text-3xl lg:text-5xl font-black mt-1">{mode === "categories" ? "Round Intro" : mode === "leaderboard" ? "Leaderboard" : currentRound?.name || "Question"}</h1>',
              'present header title'
            ],
            [
              '<h2 className="text-4xl font-black">{round?.name || "Round"}</h2>\n              </div>\n            </div>\n            <div className="flex flex-wrap gap-4">',
              '<h2 className="text-4xl font-black">{round?.name || "Round"}</h2>\n              </div>\n            </div>\n            {round?.description && <p className="text-2xl lg:text-3xl text-zinc-200 leading-relaxed mb-8">{round.description}</p>}\n            <p className="text-zinc-400 uppercase tracking-wider text-sm font-semibold mb-3">Round Categories</p>\n            <div className="flex flex-wrap gap-4">',
              'present description display'
            ]
          ]);

          patchFile('frontend/src/pages/HostSession.jsx', [
            [
              'const getRoundName = (question, fallbackOrder = 1) => {\n  if (question?.round_name) return question.round_name;\n  if (question?.round_title) return question.round_title;\n  if (question?.round && Number.isNaN(Number(question.round))) return question.round;\n  return `Round ${getRoundOrder(question, fallbackOrder)}`;\n};',
              'const getRoundName = (question, fallbackOrder = 1) => {\n  if (question?.round_name) return question.round_name;\n  if (question?.round_title) return question.round_title;\n  if (question?.round && Number.isNaN(Number(question.round))) return question.round;\n  return `Round ${getRoundOrder(question, fallbackOrder)}`;\n};\n\nconst getRoundMetadata = (session) => {\n  const raw = session?.round_descriptions || session?.rounds_metadata || session?.rounds || [];\n  return Array.isArray(raw) ? raw : [];\n};\n\nconst getRoundDescription = (session, roundOrder, roundName) => {\n  const metadata = getRoundMetadata(session);\n  const match = metadata.find((round) => Number(round.order || round.round_order) === Number(roundOrder) || String(round.name || round.round_name || "").toLowerCase() === String(roundName || "").toLowerCase());\n  return match?.description || match?.round_description || "";\n};',
              'host metadata helpers'
            ],
            [
              '        sourceOrder: getSourceOrder(question, index + 1),\n      };',
              '        sourceOrder: getSourceOrder(question, index + 1),\n        roundDescription: question.round_description || getRoundDescription(session, roundOrder, getRoundName(question, roundOrder)),\n      };',
              'host round description on flattened question'
            ],
            [
              'if (!groups.has(key)) groups.set(key, { key, name: question.roundName, startIndex: index, questions: [] });',
              'if (!groups.has(key)) groups.set(key, { key, name: question.roundName, description: question.roundDescription || "", startIndex: index, questions: [] });',
              'host round description group'
            ],
            [
              '<Button size="sm" onClick={() => setMode("categories")} className={mode === "categories" ? "gradient-btn" : "bg-zinc-800 text-zinc-200 hover:bg-zinc-700"}><Tags size={15} className="mr-2" />Round Categories</Button>',
              '<Button size="sm" onClick={() => setMode("categories")} className={mode === "categories" ? "gradient-btn" : "bg-zinc-800 text-zinc-200 hover:bg-zinc-700"}><Tags size={15} className="mr-2" />Round Intro</Button>',
              'host control label'
            ],
            [
              '<span className="text-sm font-bold text-white">{round.name}</span><Badge className="bg-zinc-800 text-zinc-300">{round.questions.length}</Badge>',
              '<span className="text-sm font-bold text-white">{round.name}</span><Badge className="bg-zinc-800 text-zinc-300">{round.questions.length}</Badge>',
              'noop'
            ]
          ]);
          NODE
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/BuildSession.jsx frontend/src/pages/PresentSession.jsx frontend/src/pages/HostSession.jsx
          git commit -m "Add round intro descriptions"
          git push

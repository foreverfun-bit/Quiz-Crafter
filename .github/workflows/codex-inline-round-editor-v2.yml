name: Codex Inline Round Editor Patch V2
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: contains(github.event.issue.title, 'codex-run-inline-round-editor-v2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move round editor under selected round
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/pages/BuildSession.jsx')
          text = path.read_text()
          start = text.index('const RoundDropdown = (')
          end = text.index('const BuilderToolbar =', start)
          replacement = r'''const RoundDropdown = ({ rounds, activeRoundId, menuOpen, setMenuOpen, onSelect, onRename, onDescribe, onDelete, onAdd }) => {
  const [manageOpen, setManageOpen] = useState(false);
  const activeRound = rounds.find((round) => round.id === activeRoundId) || rounds[0];
  return <div className="relative z-20 flex items-center gap-2"><Button type="button" onClick={() => setMenuOpen((value) => !value)} className="h-10 bg-[#0E3765] hover:bg-[#124575] border border-[#71E0DC]/20 text-[#AEEBFF] px-3 shadow-lg shadow-black/20"><span className="font-semibold truncate max-w-[190px]">{activeRound?.name || "Select Round"}</span><Badge className="ml-2 bg-zinc-950/60 text-zinc-200 border border-white/10">{activeRound?.questionIds?.length || 0}</Badge><ChevronDown size={16} className={`ml-2 transition-transform ${menuOpen ? "rotate-180" : ""}`} /></Button>{menuOpen && <div className="absolute left-0 top-12 w-[300px] rounded-xl border border-white/10 bg-zinc-950/95 shadow-2xl shadow-black/50 p-2"><div className="flex items-center justify-between gap-2 px-3 py-2"><p className="text-xs text-zinc-500">Rounds</p><button type="button" onClick={() => setManageOpen((value) => !value)} className={`text-xs font-semibold ${manageOpen ? "text-[#71E0DC]" : "text-zinc-400 hover:text-white"}`}>{manageOpen ? "Done" : "Manage"}</button></div><div className="space-y-1">{rounds.map((round, index) => { const active = round.id === activeRoundId; return <div key={round.id} className={`rounded-lg border transition-colors ${active ? "border-white/20 bg-zinc-900 text-white" : "border-transparent text-zinc-300 hover:bg-zinc-900/70 hover:text-white"}`}><button type="button" onClick={() => onSelect(round.id)} className="w-full px-3 py-2 text-left"><div className="flex items-center justify-between gap-3"><div className="min-w-0"><p className="truncate text-sm font-semibold">{round.name}</p><p className="text-xs text-zinc-500">Round {index + 1}</p></div><Badge className="bg-zinc-800 text-zinc-300">{round.questionIds?.length || 0}</Badge></div></button>{manageOpen && active && <div className="mx-2 mb-2 rounded-lg border border-[#71E0DC]/20 bg-zinc-950/70 p-2 space-y-2"><Label className="text-xs text-zinc-500">Editing this round</Label><div className="flex items-center gap-2"><Input value={round.name} onChange={(e) => onRename(round.id, e.target.value)} className="h-9 bg-zinc-950/70 border-white/10 text-white text-sm" /><Button title="Delete round" aria-label="Delete round" size="sm" variant="outline" onClick={() => onDelete(round.id)} className="h-9 w-9 p-0 border-zinc-700 text-zinc-400 hover:text-red-300"><Trash2 size={14} /></Button></div><Textarea value={round.description || ""} onChange={(e) => onDescribe(round.id, e.target.value)} placeholder="Round description or host notes" className="min-h-[64px] bg-zinc-950/70 border-white/10 text-white text-sm" /></div>}</div>; })}</div>{manageOpen && <><div className="my-2 h-px bg-white/10" /><Button type="button" onClick={onAdd} className="w-full h-9 gradient-btn"><Plus size={15} className="mr-2" />Add Round</Button><p className="px-2 pt-2 text-[11px] text-zinc-500">Select any round above to edit it in place.</p></>}</div>}</div>;
};
'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Commit changes
        run: |
          git config user.name "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"
          git add frontend/src/pages/BuildSession.jsx
          git commit -m "Move round editor under selected round" || exit 0
          git push
      - name: Close trigger issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed' });

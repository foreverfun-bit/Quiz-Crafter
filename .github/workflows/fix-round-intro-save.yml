name: Fix Round Intro Save

on:
  push:
    paths:
      - .github/workflows/fix-round-intro-save.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix round intro save retry
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'frontend/src/pages/BuildSession.jsx';
          let content = fs.readFileSync(path, 'utf8');
          const before = content;
          const from = 'const baseSessionPayload = { user_id: user.id, name: builtName, session_name: builtName, is_past: false, ...grouped }; const { data, error } = await supabase.from("sessions").insert({ ...baseSessionPayload, round_descriptions: roundDescriptions }).select("id").single(); if (error) { const retry = await supabase.from("sessions").insert(baseSessionPayload).select("id").single(); if (retry.error) throw retry.error; data = retry.data; }';
          const to = 'const baseSessionPayload = { user_id: user.id, name: builtName, session_name: builtName, is_past: false, ...grouped }; let saveResult = await supabase.from("sessions").insert({ ...baseSessionPayload, round_descriptions: roundDescriptions }).select("id").single(); if (saveResult.error) saveResult = await supabase.from("sessions").insert(baseSessionPayload).select("id").single(); if (saveResult.error) throw saveResult.error; const data = saveResult.data;';
          if (!content.includes(from)) {
            console.error('Could not find save retry code');
            process.exit(1);
          }
          content = content.replace(from, to);
          if (content === before) process.exit(1);
          fs.writeFileSync(path, content);
          NODE
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/BuildSession.jsx
          git commit -m "Fix round intro save fallback"
          git push

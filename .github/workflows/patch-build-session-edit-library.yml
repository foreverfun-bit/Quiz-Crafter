name: Patch Build Session Edit Library

on:
  push:
    paths:
      - .github/workflows/patch-build-session-edit-library.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add round descriptions, edit controls, and save to library
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'frontend/src/pages/BuildSession.jsx';
          let content = fs.readFileSync(path, 'utf8');
          const before = content;

          const replace = (from, to, label) => {
            if (!content.includes(from)) {
              console.error(`Missing patch target: ${label}`);
              process.exit(1);
            }
            content = content.replace(from, to);
          };

          replace(
            'const defaultRounds = [{ id: "round-1", name: "Round 1", questionIds: [] }, { id: "round-2", name: "Round 2", questionIds: [] }, { id: "round-3", name: "Round 3", questionIds: [] }];',
            'const defaultRounds = [{ id: "round-1", name: "Round 1", description: "", questionIds: [] }, { id: "round-2", name: "Round 2", description: "", questionIds: [] }, { id: "round-3", name: "Round 3", description: "", questionIds: [] }];',
            'default round descriptions'
          );

          replace(
            'const toSessionQuestion = (question, round, roundIndex, sourceOrder) => ({ category: question.category || "General", round_name: round.name, round_order: roundIndex + 1, source_order: sourceOrder + 1, question_text: question.question_text, correct_answer: question.correct_answer, question_type: normalizeType(question), incorrect_answers: Array.isArray(question.options) && question.options.length ? question.options.join("; ") : question.incorrect_answers || null, fun_fact: question.fun_fact || null, image_url: question.image_url || null, image_timing: normalizeImageTiming(question.image_timing) });',
            'const toSessionQuestion = (question, round, roundIndex, sourceOrder) => ({ category: question.category || "General", round_name: round.name, round_description: round.description || null, round_order: roundIndex + 1, source_order: sourceOrder + 1, question_text: question.question_text, correct_answer: question.correct_answer, question_type: normalizeType(question), incorrect_answers: Array.isArray(question.options) && question.options.length ? question.options.join("; ") : question.incorrect_answers || null, fun_fact: question.fun_fact || null, image_url: question.image_url || null, image_timing: normalizeImageTiming(question.image_timing) });',
            'session round description'
          );

          replace(
            'const handleAddRound = () => { const round = { id: newRoundId(), name: `Round ${rounds.length + 1}`, questionIds: [] }; setRounds((prev) => [...prev, round]); setActiveRoundId(round.id); };',
            'const handleAddRound = () => { const round = { id: newRoundId(), name: `Round ${rounds.length + 1}`, description: "", questionIds: [] }; setRounds((prev) => [...prev, round]); setActiveRoundId(round.id); };',
            'new round description'
          );

          replace(
            'const handleRenameRound = (roundId, name) => setRounds((prev) => prev.map((round) => (round.id === roundId ? { ...round, name } : round)));\n  const toggleQuestion =',
            'const handleRenameRound = (roundId, name) => setRounds((prev) => prev.map((round) => (round.id === roundId ? { ...round, name } : round)));\n  const handleDescribeRound = (roundId, description) => setRounds((prev) => prev.map((round) => (round.id === roundId ? { ...round, description } : round)));\n  const toggleQuestion =',
            'describe round handler'
          );

          replace(
            'const updateQuestion = (questionId, patch) => setQuestions((prev) => prev.map((question) => String(question.id) === String(questionId) ? normalizeQuestion({ ...question, ...patch }, question.question_type) : question));\n  const handleAddCustomQuestion =',
            'const updateQuestion = (questionId, patch) => setQuestions((prev) => prev.map((question) => String(question.id) === String(questionId) ? normalizeQuestion({ ...question, ...patch }, question.question_type) : question));\n  const handleSaveQuestionToLibrary = async (question) => { if (!user?.id) return toast.error("You must be signed in"); const type = normalizeType(question); const basePayload = { user_id: user.id, question_text: question.question_text, correct_answer: question.correct_answer, question_type: type, category: question.category || "", incorrect_answers: Array.isArray(question.options) && question.options.length ? question.options.join("; ") : question.incorrect_answers || null, fun_fact: question.fun_fact || null, image_url: question.image_url || null }; const attempts = [basePayload, (({ image_url, ...rest }) => rest)(basePayload), (({ image_url, fun_fact, ...rest }) => rest)(basePayload), (({ image_url, fun_fact, incorrect_answers, ...rest }) => rest)(basePayload)]; try { let saved = null; let lastError = null; for (const payload of attempts) { const { data, error } = await supabase.from("questions").insert(payload).select("*").single(); if (!error) { saved = data; break; } lastError = error; if (!String(error.message || "").includes("column")) break; } if (!saved) throw lastError || new Error("Failed to save question"); setQuestions((prev) => [normalizeQuestion(saved), ...prev]); toast.success("Saved to library"); } catch (error) { console.error("Save question to library error:", error); toast.error(error.message || "Failed to save to library"); } };\n  const handleAddCustomQuestion =',
            'save question to library handler'
          );

          replace(
            '<RoundDropdown rounds={rounds} activeRoundId={activeRoundId} menuOpen={roundMenuOpen} setMenuOpen={setRoundMenuOpen} onSelect={setActiveRoundId} onRename={handleRenameRound} onDelete={handleDeleteRound} onAdd={handleAddRound} />',
            '<RoundDropdown rounds={rounds} activeRoundId={activeRoundId} menuOpen={roundMenuOpen} setMenuOpen={setRoundMenuOpen} onSelect={setActiveRoundId} onRename={handleRenameRound} onDescribe={handleDescribeRound} onDelete={handleDeleteRound} onAdd={handleAddRound} />',
            'round dropdown prop'
          );

          replace(
            '<SelectedRoundList questions={activeRoundQuestions} rounds={rounds} activeRoundId={activeRound.id} mediaQuestionId={mediaQuestionId} actionQuestionId={actionQuestionId} onOpenMedia={setMediaQuestionId} onCloseMedia={() => setMediaQuestionId(null)} onMoveWithinRound={moveQuestionWithinRound} onMoveToRound={moveQuestionToRound} onRemove={(questionId) => removeFromRound(activeRound.id, questionId)} onUpdate={updateQuestion} onRefresh={handleRefreshGenerated} onRejectQuestion={handleRejectQuestion} onRejectCategory={handleRejectCategory} />',
            '<SelectedRoundList questions={activeRoundQuestions} rounds={rounds} activeRoundId={activeRound.id} mediaQuestionId={mediaQuestionId} actionQuestionId={actionQuestionId} onOpenMedia={setMediaQuestionId} onCloseMedia={() => setMediaQuestionId(null)} onMoveWithinRound={moveQuestionWithinRound} onMoveToRound={moveQuestionToRound} onRemove={(questionId) => removeFromRound(activeRound.id, questionId)} onUpdate={updateQuestion} onSaveToLibrary={handleSaveQuestionToLibrary} onRefresh={handleRefreshGenerated} onRejectQuestion={handleRejectQuestion} onRejectCategory={handleRejectCategory} />',
            'selected list save prop'
          );

          replace(
            'const RoundDropdown = ({ rounds, activeRoundId, menuOpen, setMenuOpen, onSelect, onRename, onDelete, onAdd }) => {',
            'const RoundDropdown = ({ rounds, activeRoundId, menuOpen, setMenuOpen, onSelect, onRename, onDescribe, onDelete, onAdd }) => {',
            'round dropdown signature'
          );

          replace(
            '<div className="flex items-center gap-2"><Input value={activeRound.name} onChange={(e) => onRename(activeRound.id, e.target.value)} className="h-9 bg-zinc-950/70 border-white/10 text-white text-sm" /><Button title="Delete round" aria-label="Delete round" size="sm" variant="outline" onClick={() => onDelete(activeRound.id)} className="h-9 w-9 p-0 border-zinc-700 text-zinc-400 hover:text-red-300"><Trash2 size={14} /></Button></div><Button type="button" onClick={onAdd} className="w-full h-9 gradient-btn"><Plus size={15} className="mr-2" />Add Round</Button>',
            '<div className="flex items-center gap-2"><Input value={activeRound.name} onChange={(e) => onRename(activeRound.id, e.target.value)} className="h-9 bg-zinc-950/70 border-white/10 text-white text-sm" /><Button title="Delete round" aria-label="Delete round" size="sm" variant="outline" onClick={() => onDelete(activeRound.id)} className="h-9 w-9 p-0 border-zinc-700 text-zinc-400 hover:text-red-300"><Trash2 size={14} /></Button></div><Textarea value={activeRound.description || ""} onChange={(e) => onDescribe(activeRound.id, e.target.value)} placeholder="Round description or host notes" className="min-h-[64px] bg-zinc-950/70 border-white/10 text-white text-sm" /><Button type="button" onClick={onAdd} className="w-full h-9 gradient-btn"><Plus size={15} className="mr-2" />Add Round</Button>',
            'round description input'
          );

          const oldSelected = 'const SelectedRoundList = ({ questions, rounds, activeRoundId, mediaQuestionId, actionQuestionId, onOpenMedia, onMoveWithinRound, onMoveToRound, onRemove, onRefresh, onRejectQuestion, onRejectCategory }) => { if (!questions.length) return <div className="min-h-[260px] flex items-center justify-center text-center"><div><p className="text-2xl font-bold text-white mb-1">No Questions</p><p className="text-zinc-500">Create, browse, or generate questions for this round.</p></div></div>; return <div className="space-y-2">{questions.map((question, index) => { const busy = String(actionQuestionId) === String(question.id); const otherRounds = rounds.filter((round) => round.id !== activeRoundId); return <div key={question.id} className="rounded-md bg-zinc-950/40 border border-white/10 p-3"><div className="flex items-start gap-3"><span className="text-zinc-500 text-sm font-mono mt-0.5 w-6 text-right">{index + 1}</span><div className="flex-1 min-w-0"><QuestionMeta question={question} /><p className="text-white text-sm mt-1 leading-relaxed">{question.question_text}</p><p className="text-zinc-500 text-xs mt-1">Answer: <span className="text-emerald-400">{question.correct_answer}</span></p>{question.image_prompt && <p className="text-amber-200 text-xs mt-1">Image idea: {question.image_prompt}</p>}{question.image_url && <p className="text-amber-300 text-xs mt-1">Media attached: {normalizeImageTiming(question.image_timing) === "after_answer" ? "after answer" : "before answer"}</p>}</div><div className="flex gap-1 flex-wrap justify-end items-start"><RowIcon label="Move up" icon={ArrowUp} onClick={() => onMoveWithinRound(activeRoundId, question.id, -1)} disabled={index === 0} /><RowIcon label="Move down" icon={ArrowDown} onClick={() => onMoveWithinRound(activeRoundId, question.id, 1)} disabled={index === questions.length - 1} />{otherRounds.length > 0 && <select aria-label="Move question to round" value="" onChange={(e) => { onMoveToRound(question.id, e.target.value); e.target.value = ""; }} className="h-8 rounded-md bg-zinc-950/70 border border-white/10 text-zinc-300 px-2 text-xs"><option value="">Move to...</option>{otherRounds.map((round) => <option key={round.id} value={round.id}>{round.name}</option>)}</select>}<RowIcon label="Add media" icon={Image} onClick={() => onOpenMedia(question.id)} active={String(mediaQuestionId) === String(question.id) || Boolean(question.image_url)} />{question.isGenerated && <RowIcon label="Refresh question" icon={busy ? Loader2 : RefreshCw} onClick={() => onRefresh(question)} disabled={busy} spin={busy} />}{question.isGenerated && <RowIcon label="Reject question" icon={Ban} onClick={() => onRejectQuestion(question)} tone="danger" />}{question.isGenerated && <RowIcon label="Reject category" icon={Tag} onClick={() => onRejectCategory(question)} tone="warning" />}<RowIcon label="Remove" icon={X} onClick={() => onRemove(question.id)} /></div></div></div>; })}</div>; };';
          const newSelected = 'const SelectedRoundList = ({ questions, rounds, activeRoundId, mediaQuestionId, actionQuestionId, onOpenMedia, onMoveWithinRound, onMoveToRound, onRemove, onUpdate, onSaveToLibrary, onRefresh, onRejectQuestion, onRejectCategory }) => { const [editingId, setEditingId] = useState(null); const [editForm, setEditForm] = useState(null); const startEdit = (question) => { setEditingId(question.id); setEditForm({ question_type: normalizeType(question), category: question.category || "", question_text: question.question_text || "", correct_answer: question.correct_answer || "", incorrect_answers: [...(question.options || parseAnswerOptions(question.incorrect_answers)), "", "", ""].slice(0, 3), fun_fact: question.fun_fact || "" }); }; const saveEdit = () => { if (!editingId || !editForm) return; const type = normalizeType(editForm); onUpdate(editingId, { question_type: type, category: editForm.category, question_text: editForm.question_text, correct_answer: type === "true_false" ? (String(editForm.correct_answer).toLowerCase() === "false" ? "False" : "True") : editForm.correct_answer, incorrect_answers: type === "multiple_choice" ? cleanList(editForm.incorrect_answers).join("; ") : type === "true_false" ? (String(editForm.correct_answer).toLowerCase() === "false" ? "True" : "False") : null, fun_fact: editForm.fun_fact }); setEditingId(null); setEditForm(null); toast.success("Question updated"); }; if (!questions.length) return <div className="min-h-[260px] flex items-center justify-center text-center"><div><p className="text-2xl font-bold text-white mb-1">No Questions</p><p className="text-zinc-500">Create, browse, or generate questions for this round.</p></div></div>; return <div className="space-y-2">{questions.map((question, index) => { const busy = String(actionQuestionId) === String(question.id); const otherRounds = rounds.filter((round) => round.id !== activeRoundId); const editing = String(editingId) === String(question.id); return <div key={question.id} className="rounded-md bg-zinc-950/40 border border-white/10 p-3"><div className="flex items-start gap-3"><span className="text-zinc-500 text-sm font-mono mt-0.5 w-6 text-right">{index + 1}</span><div className="flex-1 min-w-0"><QuestionMeta question={question} /><p className="text-white text-sm mt-1 leading-relaxed">{question.question_text}</p><p className="text-zinc-500 text-xs mt-1">Answer: <span className="text-emerald-400">{question.correct_answer}</span></p>{question.image_prompt && <p className="text-amber-200 text-xs mt-1">Image idea: {question.image_prompt}</p>}{question.image_url && <p className="text-amber-300 text-xs mt-1">Media attached: {normalizeImageTiming(question.image_timing) === "after_answer" ? "after answer" : "before answer"}</p>}</div><div className="flex gap-1 flex-wrap justify-end items-start"><RowIcon label="Move up" icon={ArrowUp} onClick={() => onMoveWithinRound(activeRoundId, question.id, -1)} disabled={index === 0} /><RowIcon label="Move down" icon={ArrowDown} onClick={() => onMoveWithinRound(activeRoundId, question.id, 1)} disabled={index === questions.length - 1} />{otherRounds.length > 0 && <select aria-label="Move question to round" value="" onChange={(e) => { onMoveToRound(question.id, e.target.value); e.target.value = ""; }} className="h-8 rounded-md bg-zinc-950/70 border border-white/10 text-zinc-300 px-2 text-xs"><option value="">Move to...</option>{otherRounds.map((round) => <option key={round.id} value={round.id}>{round.name}</option>)}</select>}<RowIcon label="Edit question" icon={Pencil} onClick={() => editing ? setEditingId(null) : startEdit(question)} active={editing} /><RowIcon label="Save to library" icon={Save} onClick={() => onSaveToLibrary(question)} /><RowIcon label="Add media" icon={Image} onClick={() => onOpenMedia(question.id)} active={String(mediaQuestionId) === String(question.id) || Boolean(question.image_url)} />{question.isGenerated && <RowIcon label="Refresh question" icon={busy ? Loader2 : RefreshCw} onClick={() => onRefresh(question)} disabled={busy} spin={busy} />}{question.isGenerated && <RowIcon label="Reject question" icon={Ban} onClick={() => onRejectQuestion(question)} tone="danger" />}{question.isGenerated && <RowIcon label="Reject category" icon={Tag} onClick={() => onRejectCategory(question)} tone="warning" />}<RowIcon label="Remove" icon={X} onClick={() => onRemove(question.id)} /></div></div>{editing && editForm && <div className="mt-3 rounded-md border border-white/10 bg-zinc-950/50 p-3 space-y-3"><div className="grid grid-cols-1 md:grid-cols-[160px_1fr] gap-2"><select value={editForm.question_type} onChange={(e) => setEditForm((prev) => ({ ...prev, question_type: e.target.value }))} className="h-9 rounded-md bg-zinc-950/70 border border-white/10 text-white px-2 text-sm"><option value="written">Written</option><option value="true_false">True/False</option><option value="multiple_choice">Multiple Choice</option></select><Input value={editForm.category} onChange={(e) => setEditForm((prev) => ({ ...prev, category: e.target.value }))} placeholder="Category" className="h-9 bg-zinc-950/70 border-white/10 text-white text-sm" /></div><Textarea value={editForm.question_text} onChange={(e) => setEditForm((prev) => ({ ...prev, question_text: e.target.value }))} placeholder="Question" className="min-h-[80px] bg-zinc-950/70 border-white/10 text-white text-sm" /><Input value={editForm.correct_answer} onChange={(e) => setEditForm((prev) => ({ ...prev, correct_answer: e.target.value }))} placeholder="Correct answer" className="h-9 bg-zinc-950/70 border-white/10 text-white text-sm" />{editForm.question_type === "multiple_choice" && <div className="grid grid-cols-1 md:grid-cols-3 gap-2">{editForm.incorrect_answers.map((answer, answerIndex) => <Input key={answerIndex} value={answer} onChange={(e) => setEditForm((prev) => ({ ...prev, incorrect_answers: prev.incorrect_answers.map((item, itemIndex) => itemIndex === answerIndex ? e.target.value : item) }))} placeholder={`Wrong answer ${answerIndex + 1}`} className="h-9 bg-zinc-950/70 border-white/10 text-white text-sm" />)}</div>}<Input value={editForm.fun_fact} onChange={(e) => setEditForm((prev) => ({ ...prev, fun_fact: e.target.value }))} placeholder="Fun fact" className="h-9 bg-zinc-950/70 border-white/10 text-white text-sm" /><div className="flex justify-end gap-2"><Button variant="outline" onClick={() => { setEditingId(null); setEditForm(null); }} className="h-9 border-zinc-700 text-zinc-400">Cancel</Button><Button onClick={saveEdit} className="h-9 gradient-btn"><Save size={14} className="mr-2" />Save Edits</Button></div></div>}</div>; })}</div>; };';
          replace(oldSelected, newSelected, 'selected question editor');

          if (content === before) {
            console.error('No changes produced.');
            process.exit(1);
          }
          fs.writeFileSync(path, content);
          NODE
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/BuildSession.jsx
          git commit -m "Add round descriptions and editable session questions"
          git push
